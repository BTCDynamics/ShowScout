{% extends "base.html" %}

{% block title %}Add Find | ShowScout{% endblock %}

{% block content %}
<div class="ss-hero mb-3">
    <div class="ss-kicker mb-2">New Find</div>
    <h1 class="ss-title mb-2">Add Find</h1>
    <p class="ss-subtitle mb-0">
        Save enough detail to get back to the table later. Photos come next, but this lets testers try the workflow now.
    </p>
</div>

<div class="card ss-card">
    <div class="card-header fw-bold">{{ show.name }}</div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('add_find', show_id=show.id) }}">
            <div class="mb-3">
                <label class="form-label">Table Number</label>
                <input class="form-control" name="table_number" placeholder="A12, 47, Back Wall..." autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label">Dealer / Company Name</label>
                <input class="form-control" name="dealer_name" placeholder="Dealer name or booth name">
            </div>

            <div class="mb-3">
                <label class="form-label">Listed Price</label>
                <input class="form-control" type="number" step="0.01" min="0" name="price_seen" placeholder="125.00">
            </div>

            <div class="mb-3">
                <label class="form-label">Raw or Graded</label>
                <select class="form-select" name="card_type">
                    <option value="Raw" selected>Raw</option>
                    <option value="Graded">Graded</option>
                    <option value="Sealed">Sealed / Wax</option>
                    <option value="Other">Other Item</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option value="Interested" selected>Interested</option>
                    <option value="Bought">Bought</option>
                    <option value="Passed">Passed</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Notes</label>
                <textarea class="form-control" name="notes" rows="3" placeholder="Player, card details, condition, trade idea, lowest price mentioned..."></textarea>
            </div>

            <div class="d-grid gap-2 d-sm-flex">
                <button class="btn btn-warning ss-big-btn fw-bold flex-fill" type="submit">Save Find</button>
                <a class="btn btn-outline-light ss-big-btn flex-fill" href="{{ url_for('show_detail', show_id=show.id) }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
