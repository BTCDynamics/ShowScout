{% extends "base.html" %}

{% block content %}

<h2>Add Find</h2>

<form method="POST">

    <div class="mb-3">
        <label>Table Number</label>
        <input
            class="form-control"
            name="table_number">
    </div>

    <div class="mb-3">
        <label>Dealer Name</label>
        <input
            class="form-control"
            name="dealer_name">
    </div>

    <div class="mb-3">
        <label>Notes</label>
        <textarea
            class="form-control"
            name="notes"></textarea>
    </div>

    <button
        class="btn btn-warning w-100"
        type="submit">

        Save Find

    </button>

</form>

{% endblock %}
