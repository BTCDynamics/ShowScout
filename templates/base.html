<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ShowScout">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{% block title %}ShowScout{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/showscout-icon-180.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/showscout-icon-192.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ss-bg: #0f172a;
            --ss-panel: #111827;
            --ss-panel-2: #1f2937;
            --ss-border: rgba(148, 163, 184, .24);
            --ss-muted: #94a3b8;
            --ss-text: #f8fafc;
            --ss-gold: #fbbf24;
            --ss-blue: #38bdf8;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: var(--ss-bg);
            color: var(--ss-text);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .ss-navbar {
            position: sticky;
            top: 0;
            z-index: 1020;
            background: rgba(17, 24, 39, .96);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--ss-border);
        }

        .ss-brand {
            font-weight: 950;
            letter-spacing: -.04em;
            color: #ffffff !important;
        }

        .ss-brand-mark {
            display: inline-grid;
            place-items: center;
            width: 2rem;
            height: 2rem;
            margin-right: .45rem;
            border-radius: .7rem;
            background: linear-gradient(145deg, #f59e0b, #fbbf24);
            color: #111827;
            font-size: .9rem;
            font-weight: 950;
        }

        .ss-page {
            max-width: 980px;
            margin: 0 auto;
        }

        .ss-hero {
            border-radius: 1.15rem;
            padding: 1.15rem;
            background:
                radial-gradient(circle at top left, rgba(59, 130, 246, .22), transparent 36%),
                radial-gradient(circle at bottom right, rgba(245, 158, 11, .14), transparent 38%),
                linear-gradient(145deg, #111827, #1f2937);
            border: 1px solid var(--ss-border);
            box-shadow: 0 .85rem 2rem rgba(0,0,0,.28);
        }

        .ss-kicker {
            color: var(--ss-gold);
            font-size: .74rem;
            font-weight: 950;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .ss-title {
            color: #ffffff;
            font-size: clamp(2rem, 11vw, 3.25rem);
            font-weight: 950;
            letter-spacing: -.055em;
            line-height: .98;
        }

        .ss-subtitle {
            color: #cbd5e1;
            font-size: .98rem;
            line-height: 1.45;
        }

        .ss-card {
            background: var(--ss-panel);
            border: 1px solid var(--ss-border);
            border-radius: 1rem;
            color: var(--ss-text);
            box-shadow: 0 .5rem 1.4rem rgba(0,0,0,.18);
        }

        .ss-muted {
            color: var(--ss-muted);
        }

        .ss-mobile-action-bar {
            position: sticky;
            bottom: 0;
            z-index: 1010;
            margin: 1rem -.75rem -1rem;
            padding: .75rem .75rem calc(.75rem + env(safe-area-inset-bottom));
            background: linear-gradient(180deg, rgba(15, 23, 42, .05), rgba(15, 23, 42, .98) 22%);
            backdrop-filter: blur(10px);
        }

        .ss-big-btn {
            min-height: 52px;
            border-radius: .95rem;
            font-weight: 900;
        }

        .ss-show-row {
            display: block;
            padding: 1rem;
            border-radius: 1rem;
            color: #f8fafc !important;
            text-decoration: none !important;
            background: linear-gradient(145deg, #172033, #202b3a);
            border: 1px solid rgba(148, 163, 184, .18);
        }

        .ss-show-row + .ss-show-row {
            margin-top: .75rem;
        }

        .ss-show-row:active {
            transform: scale(.99);
        }

        .form-control,
        .form-select,
        textarea.form-control {
            min-height: 50px;
            background-color: #020617;
            border-color: rgba(148, 163, 184, .35);
            color: #f8fafc;
            border-radius: .9rem;
            font-size: 1rem;
        }

        textarea.form-control {
            min-height: auto;
        }

        .form-control:focus,
        .form-select:focus,
        textarea.form-control:focus {
            background-color: #020617;
            color: #f8fafc;
            border-color: #60a5fa;
            box-shadow: 0 0 0 .2rem rgba(96, 165, 250, .16);
        }

        .form-control::placeholder,
        textarea.form-control::placeholder {
            color: rgba(148, 163, 184, .62);
        }

        .form-label {
            font-weight: 850;
            color: #cbd5e1;
            font-size: .86rem;
        }

        .ss-soft-panel {
            border-radius: 1rem;
            padding: .85rem;
            background: rgba(15, 23, 42, .55);
            border: 1px solid rgba(148, 163, 184, .18);
        }

        @media (max-width: 575.98px) {
            .ss-nav-actions .btn {
                padding: .35rem .55rem;
                font-size: .78rem;
            }

            main.container-fluid {
                padding-left: .85rem !important;
                padding-right: .85rem !important;
            }

            .ss-hero {
                padding: 1rem;
            }

            .ss-card .card-body {
                padding: .9rem;
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark ss-navbar mb-3">
    <div class="container-fluid px-3">
        <a class="navbar-brand ss-brand d-flex align-items-center" href="{{ url_for('home') }}">
            <span class="ss-brand-mark">SS</span>ShowScout
        </a>
        <div class="d-flex gap-2 ss-nav-actions">
            <a class="btn btn-sm btn-outline-info" href="{{ url_for('home') }}">Shows</a>
            <a class="btn btn-sm btn-warning fw-bold" href="{{ url_for('create_show') }}">+ Show</a>
        </div>
    </div>
</nav>

<main class="container-fluid px-3 pb-4">
    <div class="ss-page">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
